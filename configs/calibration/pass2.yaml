  - slug: pi-interpi-biblioteca-virtual-sistema-de-cadastros-e-registros-t1r2
    display_name: "INTERPI — Biblioteca Virtual (sesmarias / land grants)"
    scores:
      accessibility:
        score: 8
        justification_en: |
          Public JSF search app; results return record data plus JPG,
          TIFF or PDF images. Anonymous browsing through a viewer.
        justification_pt: |
          Aplicação de busca JSF pública; resultados devolvem dados do
          registro mais imagens em JPG, TIFF ou PDF. Navegação anônima
          por visualizador.
      provenance_curatorial:
        score: 9
        justification_en: |
          Partial verified transcription: sesmarias 1724–1760 typed and
          reviewed; Cadastro de Possuidores digitally transcribed;
          Arquivo Ultramarino manuscritos avulsos catalogued.
          Algorithm tier 9 = "partial or unverified transcription".
        justification_pt: |
          Transcrição parcial verificada: sesmarias 1724–1760 digitadas
          e revistas; Cadastro de Possuidores transcrito digitalmente;
          manuscritos avulsos do Arquivo Ultramarino catalogados.
          Faixa 9 do algoritmo = "transcrição parcial ou não verificada".
      corpus_completeness:
        score: 6
        justification_en: |
          Core colonial series (1684–1828) present and 16,000+
          localities indexed, but land registers "desde 1674 até os
          dias atuais" imply much material beyond the transcribed core.
          Partial (30–60%) coverage of the stated multi-century scope.
        justification_pt: |
          Núcleo colonial (1684–1828) presente e mais de 16.000
          localidades indexadas, mas registros "desde 1674 até os dias
          atuais" indicam material muito além do núcleo transcrito.
          Cobertura parcial (30–60%) do escopo declarado.
      finding_aids:
        score: 6
        justification_en: |
          Metadata search by property name and holder name plus
          locality filter; "sunburst" chart shows temporal division.
          Basic metadata search — no full-text.
        justification_pt: |
          Busca por nome de propriedade e de titular com filtro por
          localidade; gráfico "sunburst" com a divisão temporal. Busca
          por metadados básica — sem texto completo.
      pipeline_ingestion_readiness:
        score: 4
        justification_en: |
          JSF viewer wraps image delivery (property 2 partially broken),
          search-driven access rather than enumerable pattern
          (property 5 partial). Two of five properties clean.
        justification_pt: |
          Visualizador JSF encapsula a entrega das imagens (propriedade
          2 parcialmente quebrada); acesso baseado em busca em vez de
          padrão enumerável (propriedade 5 parcial). Duas de cinco
          propriedades limpas.
      uniqueness_non_duplication:
        score: 10
        justification_en: |
          Only digital source for Piauí sesmarias plus the Projeto
          Resgate manuscritos avulsos of the Capitania do Piauí held
          in Lisbon; no competing digitization at comparable scope.
        justification_pt: |
          Única fonte digital para as sesmarias do Piauí e os
          manuscritos avulsos da Capitania do Piauí (Projeto Resgate,
          Lisboa); sem digitalização concorrente em escopo comparável.
      scale:
        score: 6
        justification_en: |
          Thousands of records inferred; 16,000+ localities in the
          associated database; 1,000–10,000 page-equivalents range.
        justification_pt: |
          Milhares de registros inferidos; mais de 16.000 localidades
          na base associada; faixa 1.000–10.000 páginas equivalentes.
      linkage_potential:
        score: 8
        justification_en: |
          Transcribed sesmaria text plus consistent controlled
          vocabulary for place (locality index) and holder name = rich
          structured metadata for at least one entity type.
        justification_pt: |
          Texto de sesmaria transcrito mais vocabulário controlado
          consistente para lugar (índice de localidades) e nome de
          titular = metadados estruturados ricos para pelo menos um
          tipo de entidade.
    facets:
      institutional_type: state-archive
      licensing_posture: citation-only
      stated_roadmap: published-and-active
      fair_use_eligible: true
      size_unit_note: |
