# Pass 2 calibration scores — six anchor archives.
#
# Each entry supplies scores for all eight scored dimensions (0–10) and,
# where knowable from the survey and site inspection, the human-tagged
# facet values defined in docs/algorithm-v1.md § "Facet fields".
#
# Justifications cite anchor language from the algorithm doc and specific
# evidence from the Nordeste digital-archives survey. They are audit
# trails, not marketing copy; short and specific by design.
#
# Loader semantics (see scripts/load_calibration.py):
#   * Each score is written via app.services.scoring.record_score, so
#     re-runs supersede the prior active row for that (archive, dim) —
#     history is preserved.
#   * Facet values go through set_facet_value; identical inputs no-op.
#   * scored_by defaults to "calibration/pass2" so these rows are
#     distinguishable from live human input.

scored_by: "calibration/pass2"

archives:

  # ------------------------------------------------------------------
  - slug: ma-tribunal-de-justica-do-maranhao-arquivo-judiciario-acervo-pe-t1r1
    display_name: "TJMA — Arquivo Judiciário, Acervo Permanente"
    scores:
      accessibility:
        score: 8
        justification_en: |
          Anonymous browsing through a viewer with 33 restored processes
          offered as downloads on the same page; algorithm anchor 8
          "anonymous browsing through a viewer" cites TJMA restored
          processes directly.
        justification_pt: |
          Acesso anônimo via visualizador com 33 processos restaurados
          disponibilizados como downloads na mesma página; ancoragem 8
          do algoritmo cita justamente os processos restaurados do TJMA.
      provenance_curatorial:
        score: 5
        justification_en: |
          Basic metadata reliable at title + date + comarca; scans lack
          transcription. Inventário-analítico series (RDC-Arq) provides
          finding-aid-level description but not per-document ISAD(G).
        justification_pt: |
          Metadados básicos confiáveis quanto a título, data e comarca;
          sem transcrição. A série de inventários analíticos (RDC-Arq)
          fornece descrição a nível de instrumento de pesquisa, mas
          não ISAD(G) por documento.
      corpus_completeness:
        score: 2
        justification_en: |
          ~10,000 processos and 600 registry books publicly accessible
          out of ~60,000 digitized processos and a stated permanent
          acervo of ~350,000 documents — token coverage of stated scope.
        justification_pt: |
          ~10.000 processos e 600 livros de registro publicamente
          acessíveis frente a ~60.000 processos digitalizados e um
          acervo permanente de ~350.000 documentos — cobertura simbólica
          do escopo declarado.
      finding_aids:
        score: 6
        justification_en: |
          Per-comarca inventário PDFs (Guimarães, Loreto, Mirador,
          Porto Franco, Viana, Itapecuru-Mirim, Passagem Franca) plus a
          hotsite that surfaces metadata search — well-organized browse
          hierarchy, no full-text search.
        justification_pt: |
          Inventários por comarca em PDF (Guimarães, Loreto, Mirador,
          Porto Franco, Viana, Itapecuru-Mirim, Passagem Franca) mais um
          hotsite com busca por metadados — hierarquia de navegação bem
          organizada, sem busca em texto completo.
      pipeline_ingestion_readiness:
        score: 4
        justification_en: |
          Property 1 (addressable pages) and 4 (isolation) hold, but
          direct file URLs are not exposed in page text (property 2
          broken) and there is no enumerable API (property 5 fails).
          Two of five properties met.
        justification_pt: |
          Propriedades 1 (páginas endereçáveis) e 4 (isolamento) atendidas,
          mas URLs diretas dos arquivos não são expostas no texto da
          página (propriedade 2 quebrada) e não há API enumerável
          (propriedade 5 falha). Duas de cinco propriedades.
      uniqueness_non_duplication:
        score: 10
        justification_en: |
          Only known digital source for MA colonial-to-mid-20c judicial
          records including inventários, testamentos and ações de
          liberdade de escravos — nothing comparable digitally.
        justification_pt: |
          Única fonte digital conhecida para registros judiciais do MA
          do período colonial ao meio do século XX, incluindo
          inventários, testamentos e ações de liberdade de escravos —
          sem equivalente digital.
      scale:
        score: 10
        justification_en: |
          ~2.5M images digitized overall; 10,000 processes public would
          alone exceed 50,000 page-equivalents. Anchor 10 = 50,000+.
        justification_pt: |
          ~2,5 milhões de imagens digitalizadas ao todo; apenas os
          10.000 processos públicos ultrapassam 50.000 páginas
          equivalentes. Ancoragem 10 = 50.000+.
      linkage_potential:
        score: 5
        justification_en: |
          High-linkage in principle — inventários dense in named
          persons, places and dates — but metadata-thin delivery
          requires full transcription pipeline first.
        justification_pt: |
          Alto potencial de vinculação em tese — inventários densos em
          pessoas, lugares e datas — mas entrega pobre em metadados
          exige antes um pipeline completo de transcrição.
    facets:
      institutional_type: state-court
      licensing_posture: citation-only
      stated_roadmap: informal
      fair_use_eligible: true
      size_unit_note: |
        Counts denominated in "processos" (bundles) and "imagens" (single
        scanned pages). One processo typically bundles 10s–100s of pages.
      curatorial_rarity_notes: |
        Holds "Inventário de Joseph Martins" (Caxias, 25.05.1747), the
        oldest process in the acervo; "Ação de liberdade da escrava
        Carolina" (São Luís, 17.09.1883) is one of the surviving
        pre-abolition liberty actions with a preserved judicial trail.
      prior_use_note: |
        Cited in TJMA's own Dia Internacional do Arquivo communications
        and in IRIB coverage; academic prior use limited by access.
