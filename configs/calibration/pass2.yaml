          jornais pequenos do RN 1862–1987, substancialmente completo
          para o escopo declarado com lacunas divulgadas (Tribuna do
          Norte excluída).
      finding_aids:
        score: 4
        justification_en: |
          Filename-only search over flat listing; an index PDF exists
          but there is no facet search, no metadata database.
        justification_pt: |
          Busca apenas por nome de arquivo sobre listagem plana; existe
          um PDF-índice, mas sem facetas nem base de metadados.
      pipeline_ingestion_readiness:
        score: 8
        justification_en: |
          Properties 1–4 clean; property 5 met by enumerable directory
          pattern /jornais/<TITLE>/<YEAR>/. Four of five properties
