          competing digitization at comparable scope/quality.
        justification_pt: |
          Efetivamente único — a maioria dos títulos não está na
          Hemeroteca Digital Brasileira (Brado Conservador é a
          sobreposição conhecida); sem digitalização concorrente em
          escopo/qualidade comparáveis.
      scale:
        score: 10
        justification_en: |
          ~53,000 page-level PDFs across 69 titles, ~15 GB. Comfortably
          in the 50,000+ page-equivalents anchor.
        justification_pt: |
          Cerca de 53.000 PDFs por página em 69 títulos, ~15 GB.
          Confortavelmente na ancoragem de 50.000+ páginas equivalentes.
      linkage_potential:
        score: 3
        justification_en: |
