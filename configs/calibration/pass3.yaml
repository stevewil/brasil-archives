  # ================================================================
  # 14. RN — FamilySearch: Brazil, Rio Grande do Norte, Civil
  #     Registration
  # ================================================================
  - slug: rn-familysearch-brazil-rio-grande-do-norte-civil-registration-1-t1r43
    display_name: "FamilySearch — RN Civil Registration"
    scores:
      accessibility:
        score: 6
        justification_en: |
          Free FamilySearch account then full access to index and images
          — algorithm anchor 6.
        justification_pt: |
          Conta gratuita no FamilySearch e, então, acesso completo ao
          índice e às imagens — ancoragem 6 do algoritmo.
      provenance_curatorial:
        score: 5
        justification_en: |
          Both index and images; civil registration entries are
          structured (name, date, place, filiation). Title and date
          reliable, no fonds-level description — algorithm tier 5.
        justification_pt: |
          Índice e imagens; as entradas de registro civil são
          estruturadas (nome, data, lugar, filiação). Título e data
          confiáveis, sem descrição a nível de fundo — faixa 5 do
          algoritmo.
      corpus_completeness:
        score: 6
        justification_en: |
          Collection dated 1803-2020, though Brazilian civil registration
          only becomes systematic after 1889; partial (30-60%) of the RN
          civil-registration universe — algorithm tier 6. Flag.
        justification_pt: |
          Coleção datada de 1803-2020, ainda que o registro civil
          brasileiro só se torne sistemático após 1889; parcial (30-60%)
          do universo do registro civil do RN — faixa 6 do algoritmo.
          Sinalizar.
      finding_aids:
        score: 6
        justification_en: |
          A substantial name index plus waypoint browse — algorithm tier
          6; civil-registration collections are more fully indexed than
          the parish ones.
        justification_pt: |
          Um índice de nomes substancial mais navegação por waypoint —
          faixa 6 do algoritmo; as coleções de registro civil são mais
          plenamente indexadas do que as paroquiais.
      pipeline_ingestion_readiness:
        score: 2
        justification_en: |
          JS viewer (property 2 broken); enumerable in principle but
          FamilySearch ToS prohibits systematic download. Algorithm anchor
          2. Flag: ToS.
        justification_pt: |
          Visualizador JS (propriedade 2 quebrada); enumerável em tese,
          mas os termos do FamilySearch proíbem o download sistemático.
          Ancoragem 2 do algoritmo. Sinalizar: termos de uso.
      uniqueness_non_duplication:
        score: 4
        justification_en: |
          Civil registration is already heavily indexed and duplicated
          across genealogy platforms — algorithm tier 4 "substantially
          duplicated by better sources; still useful as backup / linkage".
        justification_pt: |
          O registro civil já é fortemente indexado e duplicado entre
          plataformas de genealogia — faixa 4 do algoritmo:
          "substancialmente duplicado por fontes melhores; ainda útil
          como backup / vinculação".
      scale:
        score: 6
        justification_en: |
          RN image count not published; the comparable PE civil-
          registration collection holds ~5.4M images, so RN is plausibly
          in the tens of thousands — scored algorithm tier 6
          conservatively. Flag: estimate.
        justification_pt: |
          Contagem de imagens do RN não publicada; a coleção comparável
          de registro civil de PE tem ~5,4 milhões de imagens, então o RN
          está plausivelmente nas dezenas de milhares — nota conservadora
          na faixa 6 do algoritmo. Sinalizar: estimativa.
      linkage_potential:
        score: 7
        justification_en: |
          Survey: "highest-value linkage asset" for RN — civil
          registration entries resolve persons named in the São José de
          Mipibu inventários and processos. Structured entries, partial
          index — algorithm tier 7, just short of "rich controlled
          vocabulary".
        justification_pt: |
          Levantamento: "ativo de vinculação de maior valor" para o RN —
          as entradas de registro civil resolvem pessoas citadas nos
          inventários e processos de São José de Mipibu. Entradas
          estruturadas, índice parcial — faixa 7 do algoritmo, logo
          abaixo de "vocabulário controlado rico".
