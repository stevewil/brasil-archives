  # ================================================================
  # 1. BA — APEB Salvador notary books, EAP703 (British Library EAP)
  # ================================================================
  - slug: ba-arquivo-publico-do-estado-da-bahia-salvador-notary-books-eap-t1r6
    display_name: "APEB — Salvador notary books (EAP703, British Library)"
    scores:
      accessibility:
        score: 8
        justification_en: |
          EAP delivers digitised files anonymously through a IIIF viewer
          with no registration — algorithm anchor 8 "anonymous browsing
          through a viewer". The BL Endangered Archives site (eap.bl.uk)
          is confirmed restored after the October 2023 cyber-attack:
          project, collection and archive-file pages for EAP703 resolve
          and are search-indexed with substantive content (2026-08-28).
          Access is stated "for research purposes only" but is not gated
          by registration.
        justification_pt: |
          O EAP entrega os arquivos digitalizados de forma anônima por
          um visualizador IIIF, sem cadastro — ancoragem 8 do algoritmo,
          "navegação anônima por visualizador". O site Endangered
          Archives da BL (eap.bl.uk) está confirmado restabelecido após
          o ciberataque de outubro de 2023: as páginas de projeto,
          coleção e arquivo do EAP703 respondem e estão indexadas com
          conteúdo substantivo (28/08/2026). O acesso é declarado
          "apenas para fins de pesquisa", mas não exige cadastro.
      provenance_curatorial:
        score: 6
        justification_en: |
          EAP catalogue records carry archival description per notary
          book (dates, scribe, parish, reference code) but no
          transcription — algorithm tier 6 "strong descriptive metadata
          but missing some ISAD(G) elements" at item level.
        justification_pt: |
          Os registros do catálogo EAP trazem descrição arquivística por
          livro de notas (datas, tabelião, freguesia, código de
          referência), mas sem transcrição — faixa 6 do algoritmo:
          "metadados descritivos fortes, com elementos ISAD(G) faltantes"
          a nível de item.
      corpus_completeness:
        score: 8
        justification_en: |
          The project's stated scope is the surviving Salvador livros de
          notas 1664-1889; it digitised 1,326 books / ~304,497 TIFF
          images across that series — substantially complete (60-90%)
          coverage of the scope it claims, algorithm tier 8.
        justification_pt: |
          O escopo declarado do projeto são os livros de notas de
          Salvador de 1664-1889 remanescentes; foram digitalizados 1.326
          livros / ~304.497 imagens TIFF dessa série — cobertura
          substancialmente completa (60-90%) do escopo declarado, faixa
          8 do algoritmo.
      finding_aids:
        score: 7
        justification_en: |
          EAP catalogue offers faceted browse (project / collection /
          file) and metadata search with date filters, plus IIIF
          manifests; no full-text of the manuscripts. Algorithm tier 7
          "faceted browse and metadata search, no full-text".
        justification_pt: |
          O catálogo EAP oferece navegação facetada (projeto / coleção /
          arquivo) e busca por metadados com filtro de data, além de
          manifestos IIIF; sem texto completo dos manuscritos. Faixa 7
          do algoritmo: "navegação facetada e busca por metadados, sem
          texto completo".
      pipeline_ingestion_readiness:
        score: 8
        justification_en: |
          Properties 1 (addressable), 2 (IIIF image API returns the
          file), 3 (TIFF masters) and 5 (IIIF manifest / OAI enumerable)
          hold; property 4 fails because each livro bundles hundreds of
          discrete escrituras. Four of five — algorithm anchor 8.
        justification_pt: |
          As propriedades 1 (endereçável), 2 (a API de imagem IIIF
          devolve o arquivo), 3 (masters TIFF) e 5 (manifesto IIIF / OAI
          enumerável) são atendidas; a propriedade 4 falha porque cada
          livro reúne centenas de escrituras distintas. Quatro de cinco
          — ancoragem 8 do algoritmo.
      uniqueness_non_duplication:
        score: 10
        justification_en: |
          Survey calls this "the single richest Nordeste notarial corpus
          digitized anywhere" — bills of sale, wills, manumission and
          slave-sale papers, 1664-1911. Only known digital source,
          algorithm anchor 10.
        justification_pt: |
          O levantamento chama isto de "o corpus notarial mais rico do
          Nordeste digitalizado em qualquer lugar" — escrituras de
          compra e venda, testamentos, cartas de alforria e de venda de
          escravos, 1664-1911. Única fonte digital conhecida, ancoragem
          10 do algoritmo.
      scale:
        score: 10
        justification_en: |
          ~304,497 TIFF images across 1,326 volumes — comfortably past
          the 50,000+ page-equivalents anchor 10.
        justification_pt: |
          ~304.497 imagens TIFF em 1.326 volumes — confortavelmente
          acima da ancoragem 10 de 50.000+ páginas equivalentes.
      linkage_potential:
        score: 5
        justification_en: |
          Notarial acts are exceptionally dense in named persons,
          places, property and enslaved people, but delivery is
          metadata-thin (no transcription) — algorithm tier 5
          "high-linkage content in principle, metadata-thin delivery;
          requires full pipeline work first".
        justification_pt: |
          Os atos notariais são excepcionalmente densos em pessoas,
          lugares, propriedades e pessoas escravizadas, mas a entrega é
          pobre em metadados (sem transcrição) — faixa 5 do algoritmo:
          "conteúdo de alta vinculação em tese, entrega pobre em
          metadados; exige antes um pipeline completo".
    facets:
      institutional_type: state-archive
      licensing_posture: citation-only
      stated_roadmap: informal
      fair_use_eligible: true
      size_unit_note: |
        Counted in "livros de notas" (bound notary volumes) and TIFF
        images (one image = one manuscript page). 1,326 volumes /
        ~304,497 images. One volume bundles hundreds of discrete acts.
      curatorial_rarity_notes: |
        Holds the surviving Salvador livros de notas 1664-1911 including
        cartas de alforria (manumission) and bills of sale of enslaved
        people — the deepest single notarial series for colonial and
        imperial Bahia. Physical originals at APEB, Salvador.
      prior_use_note: |
        Foundational for social/economic history of Bahia (Barickman,
        and the Salvador slavery historiography); the EAP703 grant
        output is widely cited even while the catalogue has been hard to
        reach.
    tags:
      periods:
        - early-colonial-1500-1700
        - late-colonial-pombaline-1700-1808
        - joanine-1808-1822
        - independence-first-reign-1822-1831
        - regency-1831-1840
        - second-reign-imperio-1840-1889
        - old-republic-1889-1930
      record_types:
        - notarial-land
        - slavery-post-abolition
      themes:
        - slavery-freedom
        - land-property
        - commerce-trade
        - family-kinship

