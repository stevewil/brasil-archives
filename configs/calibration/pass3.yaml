  # ================================================================
  - slug: ce-acervo-digital-de-fortaleza-ipplan-fortaleza-prefeitura-de-f-t1r9
    display_name: "Acervo Digital de Fortaleza"
    scores:
      accessibility:
        score: 8
        justification_en: |
          Anonymous browsing with per-record "Download" controls, no
          registration; per-item file URLs are not printed in page text
          (viewer-mediated) — algorithm anchor 8 "anonymous browsing
          through a viewer".
        justification_pt: |
          Navegação anônima com controles de "Download" por registro,
          sem cadastro; as URLs dos arquivos por item não aparecem no
          texto da página (mediado por visualizador) — ancoragem 8 do
          algoritmo: "navegação anônima por visualizador".
      provenance_curatorial:
        score: 5
        justification_en: |
          Each record carries title, author, year, document type, source
          institution and theme; title and date reliable, no fonds-level
          archival description, no transcription — algorithm tier 5.
        justification_pt: |
          Cada registro traz título, autor, ano, tipo documental,
          instituição de origem e tema; título e data confiáveis, sem
          descrição arquivística a nível de fundo, sem transcrição —
          faixa 5 do algoritmo.
      corpus_completeness:
        score: 6
        justification_en: |
          A municipal aggregator across nine categories (HEMEROTECA
          alone ~3,454 files, 1824-2022) with no single stated scope to
          measure against; partial (30-60%) coverage of the Fortaleza
          municipal-memory field — algorithm tier 6.
        justification_pt: |
          Um agregador municipal com nove categorias (só a HEMEROTECA
          tem ~3.454 arquivos, 1824-2022) sem um escopo declarado único
          para medir; cobertura parcial (30-60%) do campo de memória
          municipal de Fortaleza — faixa 6 do algoritmo.
      finding_aids:
        score: 7
        justification_en: |
          Faceted search by title, author, 60+ themes, year, 20+
          document types, 100+ source institutions and 50+ places —
          algorithm tier 7 "faceted browse and metadata search, no
          full-text".
        justification_pt: |
          Busca facetada por título, autor, 60+ temas, ano, 20+ tipos
          documentais, 100+ instituições de origem e 50+ lugares — faixa
          7 do algoritmo: "navegação facetada e busca por metadados, sem
          texto completo".
      pipeline_ingestion_readiness:
        score: 4
        justification_en: |
          Viewer-locked: per-item URLs are not exposed and would need
          reverse-engineering (property 2 broken); no documented API or
          enumerable pattern surfaced (property 5 unclear). Downloads
          exist. Two of five, algorithm anchor 4.
        justification_pt: |
          Preso ao visualizador: as URLs por item não são expostas e
          exigiriam engenharia reversa (propriedade 2 quebrada); sem API
          documentada ou padrão enumerável identificado (propriedade 5
          incerta). Downloads existem. Duas de cinco, ancoragem 4 do
          algoritmo.
      uniqueness_non_duplication:
        score: 6
        justification_en: |
          The Câmara Municipal de Fortaleza and Instituto Histórico do
          Ceará slices and the 1824-onward hemeroteca are largely
          unique, but some periodical content may overlap national
          aggregators — algorithm tier 6 "partial overlap with other
          digital sources".
        justification_pt: |
          Os recortes da Câmara Municipal de Fortaleza e do Instituto
          Histórico do Ceará e a hemeroteca a partir de 1824 são em
          grande parte únicos, mas parte do conteúdo periódico pode se
          sobrepor a agregadores nacionais — faixa 6 do algoritmo:
          "sobreposição parcial com outras fontes digitais".
      scale:
        score: 6
        justification_en: |
          HEMEROTECA alone holds ~3,454 files; nine categories together
          put holdings in the 1,000-10,000 page-equivalents band,
          algorithm tier 6.
        justification_pt: |
          Só a HEMEROTECA tem ~3.454 arquivos; as nove categorias juntas
          colocam o acervo na faixa de 1.000-10.000 páginas
          equivalentes, faixa 6 do algoritmo.
      linkage_potential:
        score: 4
        justification_en: |
          Municipal records and local press are moderately name-dense;
          facet metadata (source, theme, place) exists but there is no
          controlled entity vocabulary — algorithm tier 4.
        justification_pt: |
          Documentos municipais e imprensa local são moderadamente
          densos em nomes; há metadados de faceta (origem, tema, lugar),
          mas sem vocabulário controlado de entidades — faixa 4 do
          algoritmo.
    facets:
