  # ================================================================
  - slug: ma-arquivo-publico-do-estado-do-maranhao-siapem-acervo-digital-t1r7
    display_name: "APEM — SIAPEM \"Acervo Digital\""
    scores:
      accessibility:
        score: 4
        justification_en: |
          SIAPEM serves finding-aid PDFs and is labelled "Acervo
          Digital", but per-item image availability could not be
          confirmed on the pages fetched (2026-08-27) — algorithm tier 4
          "catalog / thumbnails only; source requires request". Flag:
          could rise to 8 if item-level scans are confirmed viewable.
        justification_pt: |
          O SIAPEM disponibiliza PDFs de instrumentos de pesquisa e se
          intitula "Acervo Digital", mas a disponibilidade de imagens
          por item não pôde ser confirmada nas páginas consultadas
          (27/08/2026) — faixa 4 do algoritmo: "catálogo / miniaturas
          apenas; original exige solicitação". Sinalizar: pode subir
          para 8 se houver scans por item visíveis.
      provenance_curatorial:
        score: 5
        justification_en: |
          Named fundos with date spans (Secretaria do Governo 1728-1914,
          Câmara Municipal de São Luís 1645-1973, DOPS 1966-1992) and an
          inventário-analítico (RDC-Arq / NOBRADE) series; title and date
          reliable, per-item ISAD(G) absent — algorithm tier 5.
        justification_pt: |
          Fundos nomeados com datas-limite (Secretaria do Governo
          1728-1914, Câmara Municipal de São Luís 1645-1973, DOPS
          1966-1992) e uma série de inventários analíticos (RDC-Arq /
          NOBRADE); título e data confiáveis, sem ISAD(G) por item —
          faixa 5 do algoritmo.
      corpus_completeness:
        score: 2
        justification_en: |
          A large described acervo (1645-1992) with only a small,
          unquantified digital-object fraction visible online — algorithm
          tier 2 "token coverage (<10%)" of stated scope. Flag: estimate.
        justification_pt: |
          Um acervo descrito extenso (1645-1992) com apenas uma pequena
          fração de objetos digitais, não quantificada, visível on-line
          — faixa 2 do algoritmo: "cobertura simbólica (<10%)" do escopo
          declarado. Sinalizar: estimativa.
      finding_aids:
        score: 6
        justification_en: |
          Search facets (Inventário, Avulsos, Códices, Coleções, Fundos)
          plus integer fundo IDs and downloadable instrument PDFs —
          algorithm tier 6 "basic metadata search or well-organized
          browse hierarchy".
        justification_pt: |
          Facetas de busca (Inventário, Avulsos, Códices, Coleções,
          Fundos) mais IDs de fundo inteiros e PDFs de instrumentos para
          download — faixa 6 do algoritmo: "busca básica por metadados ou
          hierarquia de navegação bem organizada".
      pipeline_ingestion_readiness:
        score: 4
        justification_en: |
          Property 5 partly met — fundo IDs are sequential integers
          (Secretaria do Governo = 1, Câmara Municipal = 38, DOPS = 35) —
          and instrument PDFs are directly downloadable, but item-level
          addressability and direct image URLs are unconfirmed. Two of
          five, algorithm anchor 4. Flag.
        justification_pt: |
          Propriedade 5 parcialmente atendida — os IDs de fundo são
          inteiros sequenciais (Secretaria do Governo = 1, Câmara
          Municipal = 38, DOPS = 35) — e os PDFs de instrumentos são
          baixáveis diretamente, mas a endereçabilidade por item e as
          URLs diretas de imagem não estão confirmadas. Duas de cinco,
          ancoragem 4 do algoritmo. Sinalizar.
      uniqueness_non_duplication:
        score: 8
        justification_en: |
          Only digital description route for the Fundo Secretaria do
          Governo do Maranhão 1728-1914 and the Câmara Municipal de São
          Luís fundo 1645-1973; no competing digitization — algorithm
          tier 8.
        justification_pt: |
          Única via de descrição digital para o Fundo Secretaria do
          Governo do Maranhão 1728-1914 e para o fundo Câmara Municipal
          de São Luís 1645-1973; sem digitalização concorrente — faixa 8
          do algoritmo.
      scale:
        score: 4
        justification_en: |
          "Thousands" of described units but the digital-object count is
          undisclosed and appears small; conservative page-equivalent
          estimate 100-1,000, algorithm tier 4. Flag: estimate.
        justification_pt: |
          "Milhares" de unidades descritas, mas a contagem de objetos
          digitais não é divulgada e parece pequena; estimativa
          conservadora de 100-1.000 páginas equivalentes, faixa 4 do
          algoritmo. Sinalizar: estimativa.
      linkage_potential:
        score: 4
        justification_en: |
          Administrative and legislative series are moderately
          name-dense; minimal item-level metadata for entity extraction
          — algorithm tier 4.
        justification_pt: |
          As séries administrativas e legislativas são moderadamente
          densas em nomes; metadados mínimos por item para extração de
          entidades — faixa 4 do algoritmo.
    facets:
