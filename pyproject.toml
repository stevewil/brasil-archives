[project]
name = "brasil-archives"
version = "0.1.0"
description = "Federated open metadata infrastructure for Brazilian digital archives"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Steve Williams" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
