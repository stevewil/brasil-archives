# Local Postgres for testing against the same major version as production.
#
# Prod is the PostgreSQL 10.23 instance the cPanel host provides on
# localhost (the Supabase pooler is unreachable from that box — it only
# allows outbound :443). So local Postgres testing pins to 10 too; testing
# on a newer major could green-light a migration that then breaks prod.
#
#   docker compose up -d db          # start
#   docker compose down              # stop  (add -v to wipe the volume)
#
# Then, from the venv:
#   TEST_DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/app_test pytest
#   DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/app flask db upgrade   # run the app on PG
#
# The named DBs (app, app_test, migrate_check) are created on first boot by
# the init script below.

services:
  db:
    image: postgres:10
    container_name: ba-pg10
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ba-pg10-data:/var/lib/postgresql/data
      - ./scripts/dev/pg-init.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ba-pg10-data:
